[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-operator-gpu-lab"
version = "0.1.0"
description = "GPU optimization experiments for spectral operators and Fourier Neural Operators with custom CUDA kernels."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.6"]

[tool.setuptools.packages.find]
include = ["spectral_gpu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

